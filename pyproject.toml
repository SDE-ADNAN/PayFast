[project]
name = "payfast"
version = "0.1.0"
description = "PayFast API"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.111.0",
    "pydantic[email]>=2.7.0",
    "pydantic-settings>=2.2.0",
    "sqlalchemy[asyncio]>=2.0.29",
    "asyncpg>=0.29.0",
    "uvicorn[standard]>=0.29.0",
    "structlog>=24.1.0",
    "alembic>=1.13.1",
    "pyjwt>=2.8.0",
    "cryptography>=42.0.0",
    "passlib[argon2]>=1.7.4",
    "redis>=5.0.0",
    "slowapi>=0.1.9",
    "celery>=5.3.6",
    "weasyprint>=61.0"
]

[project.optional-dependencies]
dev = [
    "ruff>=0.4.0",
    "mypy>=1.10.0",
    "pytest>=8.1.0",
    "pytest-asyncio>=0.23.6",
    "pre-commit>=3.7.0",
    "httpx>=0.27.0"
]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = []

[tool.mypy]
plugins = ["pydantic.mypy"]
strict = true
python_version = "3.12"
ignore_missing_imports = true
warn_unused_ignores = true
disallow_untyped_defs = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
