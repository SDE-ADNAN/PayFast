name: Lint and Test
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: payfast
          POSTGRES_PASSWORD: payfast_password
          POSTGRES_DB: payfast_test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"

    - name: Run Ruff
      run: ruff check .

    - name: Run Ruff Format Check
      run: ruff format --check .

    - name: Run Mypy
      run: mypy .

    - name: Run Pytest
      env:
        DATABASE_URL: postgresql+asyncpg://payfast:payfast_password@localhost:5432/payfast_test_db
        REDIS_URL: redis://localhost:6379/0
      run: pytest
